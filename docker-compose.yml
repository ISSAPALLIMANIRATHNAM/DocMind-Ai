services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: admin
      MONGO_APP_DB: ${MONGODB_DB:-docmind}
      MONGO_APP_USER: ${MONGODB_USER:?Set MONGODB_USER in .env}
      MONGO_APP_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-models:
    image: ollama/ollama:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull $${OLLAMA_LLM_MODEL:-qwen2.5:0.5b} && ollama pull $${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:0.5b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      PORT: "5000"
      MONGODB_HOST: mongo
      MONGODB_DB: ${MONGODB_DB:-docmind}
      MONGODB_USER: ${MONGODB_USER:?Set MONGODB_USER in .env}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:0.5b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    volumes:
      - chroma-data:/app/data/chroma_db
    depends_on:
      mongo:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully

volumes:
  chroma-data:
  mongo-data:
  ollama-data:
